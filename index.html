<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Mental · Tarefas</title>
<link rel="icon" id="favicon" href="IMG.png">
<link rel="apple-touch-icon" id="favicon-apple" href="IMG.png">
<script>
  // Usa como ícone da aba a imagem "IMG" do repositório (testa as extensões mais comuns)
  (function () {
    const nomes = ['IMG.png', 'IMG.jpg', 'IMG.jpeg', 'IMG.ico', 'IMG.svg', 'IMG.webp', 'IMG.PNG', 'IMG.JPG', 'img.png', 'img.jpg', 'img.jpeg', 'img.ico', 'img.svg'];
    let i = 0;
    const testar = () => {
      if (i >= nomes.length) return;
      const nome = nomes[i++], im = new Image();
      im.onload = () => { document.getElementById('favicon').href = nome; document.getElementById('favicon-apple').href = nome; };
      im.onerror = testar;
      im.src = nome + '?v=1';
    };
    testar();
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --preto:#0B0C12;
    --bg:#11121B;
    --surface:#1A1B29;
    --surface2:#2D2E47;
    --line:#383A58;
    --azul:#3E7996;
    --azul-escuro:#2F5F77;
    --azul-claro:#6FA3BE;
    --azul-palido:#B9D6E4;
    --branco:#FFFFFF;
    --texto:#E9EBF3;
    --muted:#9496B0;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--texto);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;min-height:100vh}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
  input,textarea,select{font-family:inherit;font-size:15px}
  .hidden{display:none!important}

  /* ---------- AUTH ---------- */
  .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(1200px 600px at 10% -10%, rgba(62,121,150,.35), transparent 60%),
               radial-gradient(900px 500px at 110% 110%, rgba(45,46,71,.9), transparent 60%), var(--preto)}
  .auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px 28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
  .brand-mark{width:42px;height:42px;border-radius:12px;background:var(--azul);display:grid;place-items:center}
  .brand-mark svg{width:24px;height:24px}
  .brand h1{font-size:20px;color:var(--branco)}
  .brand small{display:block;color:var(--muted);font-size:12px;font-family:'DM Sans'}
  .auth-card h2{font-size:22px;color:var(--branco);margin-bottom:6px}
  .auth-card p.sub{color:var(--muted);font-size:14px;margin-bottom:22px;line-height:1.45}
  .tag-first{display:inline-block;background:rgba(62,121,150,.18);color:var(--azul-palido);border:1px solid rgba(62,121,150,.5);border-radius:99px;padding:4px 10px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
  .input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--branco);border-radius:10px;padding:11px 13px;outline:none;transition:border .15s}
  .input:focus{border-color:var(--azul-claro)}
  textarea.input{resize:vertical;min-height:70px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:600;transition:background .15s,opacity .15s}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:var(--azul);color:var(--branco)}
  .btn-primary:hover:not(:disabled){background:var(--azul-claro)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--texto)}
  .btn-ghost:hover{background:var(--surface2)}
  .btn-danger{background:transparent;border:1px solid #6b3a4a;color:#e8b4c0}
  .btn-danger:hover{background:#3a2030}
  .btn-block{width:100%}
  .msg{font-size:13px;margin-top:10px;min-height:18px;color:var(--azul-palido)}
  .msg.err{color:#f0a3b3}

  /* ---------- APP ---------- */
  header.top{position:sticky;top:0;z-index:20;background:rgba(17,18,27,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top-inner{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px}
  .top-inner .brand{margin:0}
  .top-inner .brand h1{font-size:17px}
  .tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:12px;margin-left:auto}
  .tab{padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
  .tab.active{background:var(--surface2);color:var(--branco)}
  .icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
  .icon-btn:hover{background:var(--surface2);color:var(--branco)}
  .icon-btn svg{width:18px;height:18px}
  .user-chip{display:flex;align-items:center;gap:8px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;color:var(--azul-palido);font-family:'Space Grotesk'}

  main{max-width:1180px;margin:0 auto;padding:24px 20px 120px}

  .daybar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .daynav{display:flex;align-items:center;gap:6px}
  .day-title{font-size:26px;color:var(--branco);line-height:1.1}
  .day-title small{display:block;font-family:'DM Sans';font-size:13px;color:var(--muted);font-weight:500;margin-top:4px}
  .pill{padding:7px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--texto)}
  .pill:hover{background:var(--surface2)}
  .pill.on{background:var(--azul);border-color:var(--azul);color:var(--branco)}
  .date-input{position:relative}
  .date-input input{position:absolute;inset:0;opacity:0;cursor:pointer}

  .progress-card{background:linear-gradient(135deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;gap:20px;margin-bottom:18px}
  .progress-num{font-family:'Space Grotesk';font-size:34px;font-weight:700;color:var(--branco);min-width:90px}
  .progress-num span{font-size:16px;color:var(--muted);font-weight:500}
  .progress-track{flex:1;height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--azul),var(--azul-palido));border-radius:99px;transition:width .4s}
  .progress-meta{font-size:13px;color:var(--muted);margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}

  .section-title{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}
  .section-title .count{background:var(--surface2);color:var(--azul-palido);padding:2px 8px;border-radius:99px;font-size:11px}
  .section-title::after{content:"";flex:1;height:1px;background:var(--line)}

  .task{position:relative;display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 14px 18px;margin-bottom:8px;overflow:hidden;transition:border .15s,opacity .2s}
  .task:hover{border-color:#4a4d72}
  .task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pcolor,var(--line))}
  .task.p-alta{--pcolor:var(--branco)}
  .task.p-media{--pcolor:var(--azul-claro)}
  .task.p-baixa{--pcolor:#4b4e72}
  .task.p-meet{--pcolor:var(--azul-palido)}
  .hora{flex:none;font-family:'Space Grotesk';font-weight:700;font-size:13px;color:var(--azul-palido);background:var(--surface2);border-radius:7px;padding:3px 8px;margin-right:8px;vertical-align:1px}
  .prio-ctl{display:flex;align-items:center;gap:12px}
  .prio-ctl input[type=range]{flex:1;accent-color:var(--azul-claro);height:28px}
  .prio-ctl input[type=number]{width:76px;text-align:center}
  .prio-marks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px;padding-right:88px}
  .sub-title{font-size:11.5px;font-weight:600;color:var(--muted);margin:14px 0 8px 2px;display:flex;align-items:center;gap:6px}
  .filters .sep{width:1px;background:var(--line);margin:0 4px}
  .task.done{opacity:.55}
  .task.done .t-title{text-decoration:line-through;text-decoration-color:var(--muted)}
  .task.suggest{border-style:dashed;background:transparent}
  .task.late{border-color:#6a6d98}

  .check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--azul-claro);display:grid;place-items:center;margin-top:1px;transition:background .15s}
  .check:hover{background:rgba(62,121,150,.25)}
  .check svg{width:14px;height:14px;opacity:0}
  .check.on{background:var(--azul);border-color:var(--azul)}
  .check.on svg{opacity:1}
  .check.half{border-color:var(--azul-palido);background:linear-gradient(90deg,var(--azul) 50%,transparent 50%)}

  .t-body{flex:1;min-width:0}
  .t-title{font-weight:600;color:var(--branco);font-size:15.5px;line-height:1.35;word-wrap:break-word}
  .t-desc{color:var(--muted);font-size:13.5px;margin-top:4px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
  .t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--azul-palido)}
  .badge.outline{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .badge.strong{background:var(--branco);color:var(--preto)}
  .badge.blue{background:var(--azul);color:var(--branco)}
  .prio{display:inline-flex;align-items:flex-end;gap:2px;height:12px;margin-right:2px}
  .prio i{display:block;width:3px;border-radius:1px;background:var(--line)}
  .prio i:nth-child(1){height:5px}.prio i:nth-child(2){height:8px}.prio i:nth-child(3){height:12px}
  .prio.l1 i:nth-child(1),.prio.l2 i:nth-child(-n+2),.prio.l3 i{background:currentColor}

  .t-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .mini{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:8px;border:1px solid var(--line);color:var(--texto)}
  .mini:hover{background:var(--surface2)}
  .mini.primary{background:var(--azul);border-color:var(--azul);color:var(--branco)}
  .mini.primary:hover{background:var(--azul-claro)}
  .t-side{display:flex;gap:2px;flex:none}
  .t-side .icon-btn{width:32px;height:32px}
  .t-side .icon-btn svg{width:16px;height:16px}
  .note{margin-top:8px;font-size:12.5px;color:var(--azul-palido);background:rgba(62,121,150,.12);border-left:2px solid var(--azul);padding:6px 10px;border-radius:0 6px 6px 0}

  .empty{text-align:center;padding:50px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
  .empty h3{color:var(--branco);font-size:18px;margin-bottom:6px}

  .fab{position:fixed;right:24px;bottom:24px;z-index:30;background:var(--azul);color:var(--branco);border-radius:16px;padding:15px 22px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 12px 30px rgba(62,121,150,.4)}
  .fab:hover{background:var(--azul-claro)}
  .fab svg{width:20px;height:20px}

  /* ---------- MODAL ---------- */
  .overlay{position:fixed;inset:0;background:rgba(5,6,10,.7);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .15s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
  .modal h2{font-size:20px;color:var(--branco);margin-bottom:18px}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
  .seg{display:grid;gap:6px}
  .seg.four{grid-template-columns:repeat(4,1fr)}
  .seg.three{grid-template-columns:repeat(3,1fr)}
  .seg button{border:1px solid var(--line);border-radius:10px;padding:10px 6px;font-size:13px;font-weight:600;color:var(--muted);background:var(--bg);text-align:center}
  .seg button.on{border-color:var(--azul-claro);color:var(--branco);background:rgba(62,121,150,.22)}
  .seg button small{display:block;font-weight:400;font-size:11px;margin-top:2px;opacity:.8}
  .help{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.45}
  .days{display:flex;gap:6px}
  .days button{flex:1;aspect-ratio:1;max-width:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700;color:var(--muted)}
  .days button.on{background:var(--azul);border-color:var(--azul);color:var(--branco)}
  .quick{display:flex;gap:6px;margin-top:8px}
  .quick button{font-size:12px;color:var(--azul-palido);padding:4px 8px;border-radius:6px;border:1px solid var(--line)}

  /* ---------- LIST (todas) ---------- */
  .list-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:6px}
  .list-row.off{opacity:.45}
  .list-row .t-body .t-title{font-size:14.5px}
  .switch{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--branco);transition:left .15s}
  .switch.on{background:var(--azul)}
  .switch.on::after{left:19px}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--branco);color:var(--preto);padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .loader{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
  .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--azul-claro);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 12px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- REUNIÃO / PAUTA ---------- */
  .badge.meet{background:rgba(185,214,228,.12);color:var(--azul-palido);border:1px solid rgba(185,214,228,.35)}
  .note.pauta{white-space:pre-wrap}
  .toggle-row{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;width:100%;text-align:left}
  .toggle-row b{display:block;color:var(--branco);font-size:14px}
  .toggle-row span.h{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .pauta-item{border-left:2px solid var(--azul);padding:4px 0 4px 12px;margin-bottom:14px}
  .pauta-item .d{font-size:12px;font-weight:700;color:var(--azul-palido);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .pauta-item .x{white-space:pre-wrap;font-size:14px;line-height:1.5}

  /* ---------- CALENDÁRIO ---------- */
  .dia-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
  .dia-aside{position:sticky;top:90px}
  .cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head h3{font-size:16px;color:var(--branco);text-transform:capitalize}
  .cal-head .icon-btn{width:32px;height:32px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-dow{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding:4px 0}
  .cal-day{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;color:var(--texto);position:relative;border:1px solid transparent;background:var(--bg)}
  .cal-day:hover{border-color:var(--azul-claro)}
  .cal-day small{font-size:9.5px;font-weight:600;color:var(--muted);line-height:1}
  .cal-day.today{background:var(--azul);color:var(--branco)}
  .cal-day.today small{color:var(--azul-palido)}
  .cal-day.sel{border-color:var(--branco)}
  .cal-day.full small{color:var(--azul-palido)}
  .cal-day.late small{color:var(--branco)}
  .cal-day .mt{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--azul-palido)}
  .cal-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px}
  .cal-legend i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--azul-palido);margin-right:4px;vertical-align:1px}
  .pop-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .pop-row:last-child{border-bottom:none}
  .pop-st{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--azul-claro);display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
  .pop-st.feito{background:var(--azul);border-color:var(--azul)}
  .pop-st.feito svg{width:12px;height:12px}
  .pop-st.parcial{background:linear-gradient(90deg,var(--azul) 50%,transparent 50%);border-color:var(--azul-palido)}
  .pop-st.decidir{border-style:dashed;color:var(--azul-palido)}
  .pop-st.dispensada{border-color:var(--line);color:var(--muted)}
  .pop-row.off{opacity:.5}


  /* ---------- BARRA LATERAL ---------- */
  .layout{padding-left:232px}
  .side{position:fixed;left:0;top:0;bottom:0;width:232px;background:var(--preto);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px 16px;z-index:25}
  .side .brand{margin:0 6px 28px}
  .side .brand h1{font-size:17px}
  .nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:600;margin-bottom:4px;text-align:left;transition:background .15s,color .15s}
  .nav-item svg{width:20px;height:20px;flex:none}
  .nav-item:hover{background:var(--surface);color:var(--texto)}
  .nav-item.active{background:var(--surface2);color:var(--branco)}
  .nav-item.active svg{color:var(--azul-palido)}
  .side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .side-user{display:flex;gap:10px;align-items:center;min-width:0}
  .side-user-txt{min-width:0}
  .side-user-txt b{display:block;color:var(--branco);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-user-txt small{display:block;color:var(--muted);font-size:12px}
  .side-acts{display:flex}
  .side-acts .icon-btn{width:34px;height:34px}

  /* ---------- JANELAS (pop-ups) ---------- */
  .win{position:fixed;width:min(540px,94vw);max-height:88vh;min-width:300px;min-height:120px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.55);resize:both;overflow:hidden;animation:fade .15s}
  .win.ativa{border-color:#4d5080}
  .win.min{display:none}
  .win.max{left:12px!important;top:12px!important;width:calc(100vw - 24px)!important;height:calc(100vh - 24px)!important;max-height:none;resize:none}
  .win-bar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;background:var(--surface2);cursor:grab;user-select:none;touch-action:none}
  .win-bar:active{cursor:grabbing}
  .win-title{flex:1;font-family:'Space Grotesk';font-weight:600;font-size:14px;color:var(--branco);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:none}
  .win-btns{display:flex;gap:2px}
  .win-btns button{width:30px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--azul-palido)}

<body>

<div id="root"><div class="loader"><div><div class="spin"></div>Carregando…</div></div></div>

<script>
/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */
const DB_URL = 'https://mapa-mental-18977-default-rtdb.firebaseio.com';
const SESSAO_KEY = 'mapaMental.sessao';

/* =========================================================
   FIREBASE (REST)
   ========================================================= */
async function api(path, method = 'GET', body, qs = '') {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch(`${DB_URL}/${path}.json${qs}`, opts);
  if (!r.ok) throw new Error(`Erro ${r.status} ao acessar o banco`);
  return r.json();
}

/* =========================================================
   UTILITÁRIOS
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const hoje = () => ymd(new Date());
const fmtCurta = s => parseD(s).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
const novoId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const DIAS_CURTO = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
const DIAS_NOME = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
// Prioridade numérica 0–100 (reuniões não têm prioridade)
const PRIO_ANTIGA = { alta: 80, media: 50, baixa: 20 };   // compatibilidade com tarefas antigas
function prioNum(t) {
  if (t.reuniao) return null;
  if (typeof t.prioridade === 'number') return t.prioridade;
  return PRIO_ANTIGA[t.prioridade] ?? 50;
}
const faixa = n => n == null ? 'meet' : n >= 70 ? 'alta' : n >= 40 ? 'media' : 'baixa';
const FAIXAS = { alta: { n: '70–100', l: 3, c: 'var(--branco)' }, media: { n: '40–69', l: 2, c: 'var(--azul-claro)' }, baixa: { n: '0–39', l: 1, c: 'var(--muted)' } };
const TIPOS = { diaria: 'Diária', unica: 'Única', complexa: 'Complexa', sugestiva: 'Sugestiva' };

async function sha256(txt) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const novoSalt = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function lsSet(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} }

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

const ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 013 3L8 18l-4 1 1-4 11.5-11.5z"/><path d="M14.5 5.5l3 3"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>',
  chevUp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>',
  chevDown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
  wmin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 17h12"/></svg>',
  wmax: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
  wclose: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  pip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="15" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor"/></svg>',
  logo: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="4.5" cy="5.5" r="2"/><circle cx="19.5" cy="5.5" r="2"/><circle cx="4.5" cy="18.5" r="2"/><circle cx="19.5" cy="18.5" r="2"/><path d="M6 7l3.8 3M18 7l-3.8 3M6 17l3.8-3M18 17l-3.8-3"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg>',
};
function prioHTML(t) {
  const n = prioNum(t);
  if (n == null) return '';
  const f = FAIXAS[faixa(n)];
  return `<span class="badge outline" title="Prioridade ${n} de 100" style="color:${f.c}"><span class="prio l${f.l}"><i></i><i></i><i></i></span>Prioridade ${n}</span>`;
}
const horaHTML = t => t.horario ? `<span class="hora">${esc(t.horario)}</span>` : '';
function passaFiltro(t) {
  if (S.filtro === 'todas') return true;
  if (S.filtro === 'reuniao') return !!t.reuniao;
  return faixa(prioNum(t)) === S.filtro;
}
const brandHTML = sub => `<div class="brand"><div class="brand-mark">${ICON.logo}</div><div><h1>Mapa Mental</h1><small>${sub}</small></div></div>`;

/* =========================================================
   ESTADO
   ========================================================= */
const S = {
  user: null,
  tarefas: {},
  registros: {},          // registros[YYYY-MM-DD][tarefaId]
  pautas: {},             // pautas[tarefaId][YYYY-MM-DD] = {texto, em}
  dia: hoje(),
  view: 'inicio',          // sempre abre na Tela inicial
  calModo: lsGet('mapaMental.calModo') || 'mes',   // 'ano' | 'mes' | 'semana'
  calMin: lsGet('mapaMental.calMin') === true,
  calRef: hoje(),
  calMes: hoje().slice(0, 7),   // mês exibido no calendário (YYYY-MM)
  mesesCarregados: {},
  filtro: 'todas',        // 'todas' | 'alta' | 'media' | 'baixa' | 'reuniao'
  ordem: lsGet('mapaMental.ordem') || 'horario',   // 'horario' | 'prioridade'
};

/* =========================================================
   INICIALIZAÇÃO / AUTENTICAÇÃO
   ========================================================= */
async function boot() {
  try {
    const config = await api('config');
    if (!config || !config.adminId) return telaPrimeiroAcesso();
    const sessao = lsGet(SESSAO_KEY);
    if (sessao && sessao.id) {
      const u = await api(`usuarios/${sessao.id}`);
      if (u && u.hash === sessao.h) { S.user = { id: sessao.id, ...u }; return iniciarApp(); }
    }
    telaLogin();
  } catch (e) {
    $('#root').innerHTML = `<div class="auth-wrap"><div class="auth-card">${brandHTML('Organizador de tarefas')}
      <h2>Não foi possível conectar</h2><p class="sub">${esc(e.message)}. Verifique a internet e se as regras do Firebase permitem leitura e escrita.</p>
      <button class="btn btn-primary btn-block" onclick="location.reload()">Tentar novamente</button></div></div>`;
  }
}

function telaPrimeiroAcesso() {
  $('#root').innerHTML = `
  <div class="auth-wrap"><form class="auth-card" id="fReg" autocomplete="off">
    ${brandHTML('Organizador de tarefas')}
    <span class="tag-first">Primeiro acesso</span>
    <h2>Criar login administrativo</h2>
    <p class="sub">Este cadastro só aparece uma vez. Depois dele, o acesso será sempre pela tela de login.</p>
    <div class="field"><label>Nome</label><input class="input" name="nome" required></div>
    <div class="field"><label>E-mail</label><input class="input" type="email" name="email" required></div>
    <div class="field"><label>Usuário</label><input class="input" name="usuario" required pattern="[A-Za-z0-9._\\-]{3,}" title="Mínimo 3 caracteres, sem espaços"></div>
    <div class="row2">
      <div class="field"><label>Senha</label><input class="input" type="password" name="senha" required minlength="6"></div>
      <div class="field"><label>Confirmar</label><input class="input" type="password" name="senha2" required minlength="6"></div>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Criar administrador</button>
    <div class="msg" id="msg"></div>
  </form></div>`;
  $('#fReg').onsubmit = async ev => {
    ev.preventDefault();
    const f = Object.fromEntries(new FormData(ev.target));
    const msg = $('#msg'); msg.className = 'msg';
    if (f.senha !== f.senha2) { msg.className = 'msg err'; msg.textContent = 'As senhas não conferem.'; return; }
    const btn = ev.target.querySelector('button'); btn.disabled = true; msg.textContent = 'Criando…';
    try {
      const cfg = await api('config');
      if (cfg && cfg.adminId) { msg.className = 'msg err'; msg.textContent = 'Já existe um administrador. Recarregando…'; return setTimeout(() => location.reload(), 1200); }
      const id = novoId('u_'), salt = novoSalt();
      const u = { nome: f.nome.trim(), email: f.email.trim().toLowerCase(), usuario: f.usuario.trim().toLowerCase(),
                  perfil: 'admin', salt, hash: await sha256(salt + f.senha), criadoEm: Date.now() };
      await api(`usuarios/${id}`, 'PUT', u);
      await api('config', 'PUT', { adminId: id, criadoEm: Date.now() });
      S.user = { id, ...u };
      lsSet(SESSAO_KEY, { id, h: u.hash });
      iniciarApp();
    } catch (e) { btn.disabled = false; msg.className = 'msg err'; msg.textContent = e.message; }
  };
}

function telaLogin() {
  $('#root').innerHTML = `
  <div class="auth-wrap"><form class="auth-card" id="fLog">
    ${brandHTML('Organizador de tarefas')}
    <h2>Entrar</h2>
    <p class="sub">Use seu usuário ou e-mail.</p>
    <div class="field"><label>Usuário ou e-mail</label><input class="input" name="login" required autofocus></div>
    <div class="field"><label>Senha</label><input class="input" type="password" name="senha" required></div>
    <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    <div class="msg" id="msg"></div>
  </form></div>`;
  $('#fLog').onsubmit = async ev => {
    ev.preventDefault();
    const f = Object.fromEntries(new FormData(ev.target));
    const msg = $('#msg'); const btn = ev.target.querySelector('button');
    btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Verificando…';
    try {
      const users = await api('usuarios') || {};
      const login = f.login.trim().toLowerCase();
      const entry = Object.entries(users).find(([, u]) => u.usuario === login || u.email === login);
      if (!entry || (await sha256(entry[1].salt + f.senha)) !== entry[1].hash) throw new Error('Usuário ou senha incorretos.');
      S.user = { id: entry[0], ...entry[1] };
      lsSet(SESSAO_KEY, { id: entry[0], h: entry[1].hash });
      iniciarApp();
    } catch (e) { btn.disabled = false; msg.className = 'msg err'; msg.textContent = e.message; }
  };
}

function sair() { lsSet(SESSAO_KEY, null); S.user = null; location.reload(); }

/* =========================================================
   DADOS
   ========================================================= */
async function carregarTarefas() {
  const [t, p] = await Promise.all([api('tarefas'), api('pautas')]);
  S.tarefas = t || {}; S.pautas = p || {};
}
async function carregarRegistros(dia) { S.registros[dia] = await api(`registros/${dia}`) || {}; }

// Carrega os registros do mês inteiro de uma vez (para o calendário)
async function carregarMes(ym, forcar = false) {
  if (S.mesesCarregados[ym] && !forcar) return;
  const q = `?orderBy=${encodeURIComponent('"$key"')}&startAt=${encodeURIComponent(`"${ym}-01"`)}&endAt=${encodeURIComponent(`"${ym}-31"`)}`;
  const data = await api('registros', 'GET', undefined, q) || {};
  const [y, m] = ym.split('-').map(Number), n = new Date(y, m, 0).getDate();
  for (let d = 1; d <= n; d++) {
    const k = `${ym}-${pad(d)}`;
    if (forcar || !S.registros[k]) S.registros[k] = data[k] || {};
  }
  S.mesesCarregados[ym] = true;
}

async function iniciarApp() {
  $('#root').innerHTML = `<div class="loader"><div><div class="spin"></div>Carregando tarefas…</div></div>`;
  S.calMes = S.dia.slice(0, 7);
  await Promise.all([carregarTarefas(), carregarRegistros(S.dia), carregarMes(S.calMes)]);
  render();
}

async function irParaDia(d) {
  S.dia = d;
  const ym = d.slice(0, 7);
  if (ym !== S.calMes) S.calMes = ym;
  if (!S.registros[d] || !S.mesesCarregados[ym]) {
    render();
    await Promise.all([S.registros[d] ? null : carregarRegistros(d), carregarMes(ym)]);
  }
  render();
}

async function irParaMes(delta) {
  const [y, m] = S.calMes.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  S.calMes = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  render();
  if (!S.mesesCarregados[S.calMes]) { await carregarMes(S.calMes); render(); }
}

// Sincroniza quando a aba volta a ficar visível (ex.: usou em outro dispositivo)
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && S.user && !janelaTopo()) {
    try { await Promise.all([carregarTarefas(), carregarRegistros(S.dia), carregarMes(S.calMes, true)]); render(); } catch {}
  }
});

async function salvar(fn) {
  try { await fn(); }
  catch (e) { toast('Falha ao salvar — recarregando'); await Promise.all([carregarTarefas(), carregarRegistros(S.dia)]); render(); }
}

/* =========================================================
   REGRAS: QUAIS TAREFAS APARECEM NO DIA
   ========================================================= */
function itensDoDia(D) {
  const H = hoje(), reg = S.registros[D] || {}, dow = parseD(D).getDay(), out = [];
  for (const [id, t] of Object.entries(S.tarefas)) {
    if (t.ativa === false) continue;
    const r = reg[id] || {};
    const it = { id, t, status: 'pendente' };
    switch (t.tipo) {
      case 'diaria':
        if (!(t.dias || []).includes(dow) || D < t.inicio) continue;
        it.status = r.feito ? 'feito' : 'pendente';
        break;
      case 'unica':
        if (t.data === D) it.status = t.concluidaEm ? 'feito' : 'pendente';
        else if (D === H && t.data < H && (!t.concluidaEm || t.concluidaEm === H)) { it.status = t.concluidaEm ? 'feito' : 'pendente'; it.atrasada = !t.concluidaEm; }
        else continue;
        break;
      case 'complexa':
        if (D < t.data) continue;
        if (t.concluidaEm && D > t.concluidaEm) continue;
        it.diaN = diffDays(t.data, D) + 1;
        it.status = t.concluidaEm === D ? 'feito' : (t.historico && t.historico[D]) ? 'parcial' : 'pendente';
        if (it.diaN > 1 && it.status !== 'feito') it.rolou = true;
        break;
      case 'sugestiva':
        if (D < t.inicio) continue;
        if (!r.decisao) it.status = 'decidir';
        else if (r.decisao === 'nao') it.status = 'dispensada';
        else it.status = r.feito ? 'feito' : 'pendente';
        break;
      default: continue;
    }
    out.push(it);
  }
  return out;
}

const cmpPrio = (a, b) =>
  (b.atrasada ? 1 : 0) - (a.atrasada ? 1 : 0) ||
  (prioNum(b.t) ?? -1) - (prioNum(a.t) ?? -1) ||
  (a.t.criadaEm || 0) - (b.t.criadaEm || 0);
const cmpHora = (a, b) =>
  (a.t.horario ? 0 : 1) - (b.t.horario ? 0 : 1) ||
  (a.t.horario || '').localeCompare(b.t.horario || '') || cmpPrio(a, b);
const ordenar = arr => arr.sort(cmpPrio);
const ordenarDia = arr => arr.sort(S.ordem === 'horario' ? cmpHora : cmpPrio);

/* =========================================================
   AÇÕES NAS TAREFAS
   ========================================================= */
function estaFeito(id, D) {
  const t = S.tarefas[id];
  if (t.tipo === 'unica') return !!t.concluidaEm;
  if (t.tipo === 'complexa') return t.concluidaEm === D;
  return !!(S.registros[D] && S.registros[D][id] && S.registros[D][id].feito);
}

// Ao concluir uma reunião, abre o campo de pauta antes
function alternarFeito(id) {
  const t = S.tarefas[id];
  if (t.reuniao && !estaFeito(id, S.dia)) return abrirPauta(id, S.dia, true);
  aplicarFeito(id);
}

function abrirPauta(id, D, concluir) {
  let W; const q = sel => W.querySelector(sel);
  const t = S.tarefas[id];
  const atual = (S.pautas[id] && S.pautas[id][D] && S.pautas[id][D].texto) || '';
  W = abrirModal(`
    <h2>Pauta da reunião</h2>
    <p class="help" style="margin:-8px 0 16px"><b style="color:var(--branco)">${esc(t.titulo)}</b> · ${parseD(D).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
    <div class="field"><label>Pauta / o que foi tratado</label>
      <textarea class="input" id="ptTexto" style="min-height:160px" placeholder="- Assunto 1&#10;- Decisões&#10;- Próximos passos / responsáveis">${esc(atual)}</textarea></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="fecharModal(this)">Cancelar</button>
      <button class="btn btn-primary" id="ptOk">${concluir ? 'Salvar e concluir' : 'Salvar pauta'}</button>
    </div>`);
  q('#ptOk').onclick = () => {
    const texto = q('#ptTexto').value.trim();
    S.pautas[id] = S.pautas[id] || {};
    if (texto) S.pautas[id][D] = { texto, em: Date.now() }; else delete S.pautas[id][D];
    fecharModal(W);
    salvar(() => texto ? api(`pautas/${id}/${D}`, 'PUT', S.pautas[id][D]) : api(`pautas/${id}/${D}`, 'DELETE'));
    if (concluir) aplicarFeito(id); else render();
  };
}

function verPautas(id) {
  let W; const q = sel => W.querySelector(sel);
  const t = S.tarefas[id], p = S.pautas[id] || {};
  const datas = Object.keys(p).sort().reverse();
  W = abrirModal(`
    <h2>Pautas · ${esc(t.titulo)}</h2>
    ${datas.length ? datas.map(d => `<div class="pauta-item"><div class="d">${parseD(d).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' })}</div><div class="x">${esc(p[d].texto)}</div></div>`).join('')
      : `<p class="help">Nenhuma pauta registrada ainda.</p>`}
    <div class="modal-foot"><button class="btn btn-ghost" onclick="fecharModal(this)">Fechar</button></div>`);
}

function aplicarFeito(id) {
  const t = S.tarefas[id], D = S.dia;
  const reg = (S.registros[D] = S.registros[D] || {});
  if (t.tipo === 'diaria' || t.tipo === 'sugestiva') {
    const atual = reg[id] || {};
    const novo = { ...atual, feito: !atual.feito, em: Date.now() };
    reg[id] = novo; render();
    salvar(() => api(`registros/${D}/${id}`, 'PUT', novo));
  } else if (t.tipo === 'unica') {
    t.concluidaEm = t.concluidaEm ? null : D; render();
    salvar(() => api(`tarefas/${id}`, 'PATCH', { concluidaEm: t.concluidaEm }));
  } else if (t.tipo === 'complexa') {
    if (t.concluidaEm === D) t.concluidaEm = null; else t.concluidaEm = D;
    render();
    salvar(() => api(`tarefas/${id}`, 'PATCH', { concluidaEm: t.concluidaEm }));
    if (t.concluidaEm) toast('Tarefa complexa concluída');
  }
}

function decidir(id, valor) {
  const D = S.dia, reg = (S.registros[D] = S.registros[D] || {});
  if (valor === null) { delete reg[id]; render(); return salvar(() => api(`registros/${D}/${id}`, 'DELETE')); }
  reg[id] = { decisao: valor, feito: false, em: Date.now() }; render();
  salvar(() => api(`registros/${D}/${id}`, 'PUT', reg[id]));
}

function marcarParcial(id) {
  let W; const q = sel => W.querySelector(sel);
  const t = S.tarefas[id], D = S.dia;
  W = abrirModal(`
    <h2>Parcialmente concluída</h2>
    <p class="help" style="margin:-8px 0 16px">A tarefa continua aberta e aparece automaticamente no dia seguinte.</p>
    <div class="field"><label>O que foi feito hoje? (opcional)</label>
      <textarea class="input" id="pNota" placeholder="Ex.: levantei os dados, falta montar o relatório">${esc(t.historico?.[D]?.nota || '')}</textarea></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="fecharModal(this)">Cancelar</button>
      <button class="btn btn-primary" id="pOk">Salvar progresso</button></div>`);
  q('#pOk').onclick = () => {
    const reg = { nota: q('#pNota').value.trim(), em: Date.now() };
    t.historico = t.historico || {}; t.historico[D] = reg;
    if (t.concluidaEm === D) t.concluidaEm = null;
    fecharModal(W); render();
    salvar(async () => { await api(`tarefas/${id}/historico/${D}`, 'PUT', reg); await api(`tarefas/${id}`, 'PATCH', { concluidaEm: t.concluidaEm || null }); });
  };
}

function desfazerParcial(id) {
  const t = S.tarefas[id], D = S.dia;
  if (t.historico) delete t.historico[D];
  render();
  salvar(() => api(`tarefas/${id}/historico/${D}`, 'DELETE'));
}

/* =========================================================
   MODAL GENÉRICO
   ========================================================= */
// Todas as janelas (pop-ups): arrastar pela tela, redimensionar, maximizar, minimizar e fechar
let Z = 100, CASCATA = 0;
function dock() {
  let d = document.getElementById('dock');
  if (!d) { d = document.createElement('div'); d.id = 'dock'; document.body.appendChild(d); }
  return d;
}
function focarJanela(w) { w.style.zIndex = ++Z; document.querySelectorAll('.win').forEach(x => x.classList.toggle('ativa', x === w)); }
function janelaTopo() {
  return [...document.querySelectorAll('.win:not(.min)')].sort((a, b) => (+b.style.zIndex) - (+a.style.zIndex))[0];
}
function abrirModal(html, titulo) {
  const w = document.createElement('div');
  w.className = 'win';
  w.innerHTML = `
    <div class="win-bar">
      <span class="win-title"></span>
      <div class="win-btns">
        <button title="Minimizar" data-a="min">${ICON.wmin}</button>
        <button title="Maximizar / restaurar" data-a="max">${ICON.wmax}</button>
        <button title="Fechar" data-a="fechar">${ICON.wclose}</button>
      </div>
    </div>
    <div class="modal">${html}</div>`;
  document.body.appendChild(w);
  const h2 = w.querySelector('.modal h2');
  const tit = titulo || (h2 ? h2.textContent.trim() : 'Janela');
  w.querySelector('.win-title').textContent = tit;
  w.dataset.titulo = tit;

  // posição inicial: centralizada, em cascata
  const r = w.getBoundingClientRect(), off = (CASCATA++ % 6) * 26;
  w.style.left = Math.max(8, (innerWidth - r.width) / 2 + off) + 'px';
  w.style.top = Math.max(8, Math.min((innerHeight - r.height) / 2 - 30, 90) + off) + 'px';
  focarJanela(w);

  w.addEventListener('pointerdown', () => focarJanela(w));
  w.querySelector('.win-btns').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'fechar') fecharModal(w);
    if (b.dataset.a === 'min') minimizarJanela(w);
    if (b.dataset.a === 'max') w.classList.toggle('max');
  };
  // arrastar pela barra de título
  const bar = w.querySelector('.win-bar');
  bar.addEventListener('dblclick', e => { if (!e.target.closest('button')) w.classList.toggle('max'); });
  bar.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || w.classList.contains('max')) return;
    const sx = e.clientX, sy = e.clientY, ox = w.offsetLeft, oy = w.offsetTop;
    try { bar.setPointerCapture(e.pointerId); } catch {}
    const mover = ev => {
      const nx = Math.min(Math.max(ox + ev.clientX - sx, 60 - w.offsetWidth), innerWidth - 60);
      const ny = Math.min(Math.max(oy + ev.clientY - sy, 0), innerHeight - 40);
      w.style.left = nx + 'px'; w.style.top = ny + 'px';
    };
    const soltar = () => { bar.removeEventListener('pointermove', mover); bar.removeEventListener('pointerup', soltar); };
    bar.addEventListener('pointermove', mover); bar.addEventListener('pointerup', soltar);
  });
  setTimeout(() => w.querySelector('.modal input:not([type=range]),.modal textarea')?.focus(), 30);
  return w;
}
function minimizarJanela(w) {
  w.classList.add('min');
  const c = document.createElement('button');
  c.className = 'dock-chip'; c.title = 'Restaurar';
  c.innerHTML = `<span>${esc(w.dataset.titulo)}</span><i data-x title="Fechar">${ICON.wclose}</i>`;
  c.onclick = e => {
    if (e.target.closest('[data-x]')) return fecharModal(w);
    w.classList.remove('min'); c.remove(); w._chip = null; focarJanela(w);
  };
  w._chip = c; dock().appendChild(c);
}
function fecharModal(x) {
  const w = x instanceof Element ? (x.closest('.win') || x) : janelaTopo();
  if (!w) return;
  if (w._chip) w._chip.remove();
  w.remove();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });

function confirmar(titulo, texto, rotulo, acao) {
  let W; const q = sel => W.querySelector(sel);
  W = abrirModal(`<h2>${esc(titulo)}</h2><p class="help" style="font-size:14px">${texto}</p>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="fecharModal(this)">Cancelar</button>
    <button class="btn btn-danger" id="cOk">${esc(rotulo)}</button></div>`);
  q('#cOk').onclick = () => { fecharModal(W); acao(); };
}

/* =========================================================
   FORMULÁRIO DE TAREFA (nova / editar)
   ========================================================= */
function formTarefa(id) {
  let W; const q = sel => W.querySelector(sel);
  const t = id ? S.tarefas[id] : null;
  const f = {
    titulo: t?.titulo || '', descricao: t?.descricao || '',
    tipo: t?.tipo || 'unica', prioridade: t ? (prioNum({ ...t, reuniao: false })) : 50,
    horario: t?.horario || '',
    dias: t?.dias ? [...t.dias] : [1, 2, 3, 4, 5],
    data: t?.data || S.dia, inicio: t?.inicio || hoje(),
    reuniao: !!t?.reuniao,
  };
  const ajuda = {
    diaria: 'Repete nos dias da semana selecionados.',
    unica: 'Aparece só na data escolhida. Se não for concluída, aparece como atrasada no dia de hoje.',
    complexa: 'Começa na data escolhida. Pode ser marcada como parcialmente concluída — enquanto não for concluída, passa automaticamente para o dia seguinte.',
    sugestiva: 'Aparece todos os dias para você decidir se vai ser necessário fazer ou não naquele dia.',
  };

  const desenhar = () => {
    const extra =
      f.tipo === 'diaria' ? `
        <div class="field"><label>Dias da semana</label>
          <div class="days">${DIAS_CURTO.map((d, i) => `<button type="button" data-d="${i}" title="${DIAS_NOME[i]}" class="${f.dias.includes(i) ? 'on' : ''}">${d}</button>`).join('')}</div>
          <div class="quick"><button type="button" data-q="util">Seg a Sex</button><button type="button" data-q="todos">Todos</button><button type="button" data-q="nenhum">Limpar</button></div>
        </div>
        <div class="field"><label>Começa em</label><input class="input" type="date" id="fInicio" value="${f.inicio}"></div>`
      : f.tipo === 'unica' ? `<div class="field"><label>Data</label><input class="input" type="date" id="fData" value="${f.data}" required></div>`
      : f.tipo === 'complexa' ? `<div class="field"><label>Data de início</label><input class="input" type="date" id="fData" value="${f.data}" required></div>`
      : `<div class="field"><label>Começa a aparecer em</label><input class="input" type="date" id="fInicio" value="${f.inicio}"></div>`;

    q('.modal').innerHTML = `
      <h2>${t ? 'Editar tarefa' : 'Nova tarefa'}</h2>
      <div class="field"><label>Tarefa</label><input class="input" id="fTitulo" value="${esc(f.titulo)}" placeholder="O que precisa ser feito?" maxlength="160"></div>
      <div class="field"><label>Detalhes (opcional)</label><textarea class="input" id="fDesc" placeholder="Observações, links, passos…">${esc(f.descricao)}</textarea></div>
      <div class="field"><label>Tipo</label>
        <div class="seg four" id="segTipo">${Object.entries(TIPOS).map(([k, n]) => `<button type="button" data-v="${k}" class="${f.tipo === k ? 'on' : ''}">${n}</button>`).join('')}</div>
        <div class="help">${ajuda[f.tipo]}</div>
      </div>
      ${extra}
      <div class="field"><label>Horário (opcional)</label><input class="input" type="time" id="fHora" value="${esc(f.horario)}" style="max-width:160px"></div>
      <div class="field">
        <button type="button" class="toggle-row" id="fReu">
          <span class="switch ${f.reuniao ? 'on' : ''}"></span>
          <span><b>É uma reunião</b><span class="h">Ao concluir, abre um campo para registrar a pauta. Reuniões não têm prioridade.</span></span>
        </button>
      </div>
      ${f.reuniao ? '' : `<div class="field"><label>Prioridade (0 a 100)</label>
        <div class="prio-ctl"><input type="range" id="fPrioR" min="0" max="100" step="1" value="${f.prioridade}">
          <input class="input" type="number" id="fPrio" min="0" max="100" value="${f.prioridade}"></div>
        <div class="prio-marks"><span>0 · baixa</span><span>50</span><span>100 · máxima</span></div>
      </div>`}
      <div class="msg err" id="fMsg"></div>
      <div class="modal-foot">
        ${t ? `<button class="btn btn-danger" id="fDel" style="margin-right:auto">Excluir</button>` : ''}
        <button class="btn btn-ghost" onclick="fecharModal(this)">Cancelar</button>
        <button class="btn btn-primary" id="fSalvar">${t ? 'Salvar' : 'Adicionar'}</button>
      </div>`;

    const ler = () => {
      f.titulo = q('#fTitulo').value; f.descricao = q('#fDesc').value;
      if (q('#fData')) f.data = q('#fData').value;
      if (q('#fInicio')) f.inicio = q('#fInicio').value;
      f.horario = q('#fHora').value;
      if (q('#fPrio')) f.prioridade = Math.max(0, Math.min(100, Math.round(+q('#fPrio').value || 0)));
    };
    q('#segTipo').onclick = e => { const b = e.target.closest('button'); if (!b) return; ler(); f.tipo = b.dataset.v; desenhar(); };
    q('#fReu').onclick = () => { ler(); f.reuniao = !f.reuniao; desenhar(); };
    if (q('#fPrioR')) {
      q('#fPrioR').oninput = e => { q('#fPrio').value = e.target.value; };
      q('#fPrio').oninput = e => { q('#fPrioR').value = e.target.value; };
    }
    W.querySelectorAll('.days button').forEach(b => b.onclick = () => {
      ler(); const d = +b.dataset.d;
      f.dias = f.dias.includes(d) ? f.dias.filter(x => x !== d) : [...f.dias, d].sort(); desenhar();
    });
    W.querySelectorAll('.quick button').forEach(b => b.onclick = () => {
      ler(); f.dias = b.dataset.q === 'util' ? [1, 2, 3, 4, 5] : b.dataset.q === 'todos' ? [0, 1, 2, 3, 4, 5, 6] : []; desenhar();
    });
    if (q('#fDel')) q('#fDel').onclick = () => excluirTarefa(id);
    q('#fSalvar').onclick = () => {
      ler();
      const titulo = f.titulo.trim();
      if (!titulo) return q('#fMsg').textContent = 'Escreva a tarefa.';
      if (f.tipo === 'diaria' && !f.dias.length) return q('#fMsg').textContent = 'Selecione pelo menos um dia.';
      if ((f.tipo === 'unica' || f.tipo === 'complexa') && !f.data) return q('#fMsg').textContent = 'Escolha a data.';
      const base = { titulo, descricao: f.descricao.trim(), tipo: f.tipo, prioridade: f.reuniao ? null : f.prioridade, horario: f.horario || null,
                     dias: null, data: null, inicio: null, reuniao: f.reuniao || null };
      if (f.tipo === 'diaria') { base.dias = f.dias; base.inicio = f.inicio || hoje(); }
      if (f.tipo === 'sugestiva') base.inicio = f.inicio || hoje();
      if (f.tipo === 'unica' || f.tipo === 'complexa') base.data = f.data;

      fecharModal(W);
      if (t) {
        if (t.tipo !== base.tipo) { base.concluidaEm = null; base.historico = null; }
        const novo = { ...t, ...base };
        Object.keys(novo).forEach(k => novo[k] === null && delete novo[k]);
        S.tarefas[id] = novo; render(); toast('Tarefa atualizada');
        salvar(() => api(`tarefas/${id}`, 'PATCH', base));
      } else {
        const nid = novoId('t_');
        const nova = { ...base, ativa: true, criadaEm: Date.now() };
        Object.keys(nova).forEach(k => nova[k] === null && delete nova[k]);
        S.tarefas[nid] = nova; render(); toast('Tarefa adicionada');
        salvar(() => api(`tarefas/${nid}`, 'PUT', nova));
      }
    };
  };

  W = abrirModal('', t ? 'Editar tarefa' : 'Nova tarefa');
  desenhar();
  q('#fTitulo').focus();
}

function excluirTarefa(id) {
  const t = S.tarefas[id];
  confirmar('Excluir tarefa?', `"<b>${esc(t.titulo)}</b>" será removida de todos os dias. Essa ação não pode ser desfeita.`, 'Excluir', () => {
    delete S.tarefas[id]; delete S.pautas[id]; render(); toast('Tarefa excluída');
    salvar(async () => { await api(`tarefas/${id}`, 'DELETE'); await api(`pautas/${id}`, 'DELETE'); });
  });
}

function alternarAtiva(id) {
  const t = S.tarefas[id];
  t.ativa = t.ativa === false; render();
  salvar(() => api(`tarefas/${id}`, 'PATCH', { ativa: t.ativa }));
}

/* =========================================================
   CONFIGURAÇÕES DA CONTA
   ========================================================= */
function abrirConta() {
  let W; const q = sel => W.querySelector(sel);
  const u = S.user;
  W = abrirModal(`
    <h2>Minha conta</h2>
    <div class="field"><label>Nome</label><input class="input" id="cNome" value="${esc(u.nome)}"></div>
    <div class="row2">
      <div class="field"><label>Usuário</label><input class="input" value="${esc(u.usuario)}" disabled></div>
      <div class="field"><label>E-mail</label><input class="input" value="${esc(u.email)}" disabled></div>
    </div>
    <div class="section-title" style="margin-top:8px">Trocar senha</div>
    <div class="field"><label>Senha atual</label><input class="input" type="password" id="cAtual"></div>
    <div class="row2">
      <div class="field"><label>Nova senha</label><input class="input" type="password" id="cNova"></div>
      <div class="field"><label>Confirmar</label><input class="input" type="password" id="cNova2"></div>
    </div>
    <div class="msg err" id="cMsg"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="fecharModal(this)">Fechar</button>
      <button class="btn btn-primary" id="cSalvar">Salvar</button>
    </div>`);
  q('#cSalvar').onclick = async () => {
    const msg = q('#cMsg'); msg.textContent = '';
    const patch = {}, nome = q('#cNome').value.trim();
    if (nome && nome !== u.nome) patch.nome = nome;
    const atual = q('#cAtual').value, nova = q('#cNova').value, nova2 = q('#cNova2').value;
    if (atual || nova || nova2) {
      if ((await sha256(u.salt + atual)) !== u.hash) return msg.textContent = 'Senha atual incorreta.';
      if (nova.length < 6) return msg.textContent = 'A nova senha precisa ter pelo menos 6 caracteres.';
      if (nova !== nova2) return msg.textContent = 'As novas senhas não conferem.';
      patch.salt = novoSalt(); patch.hash = await sha256(patch.salt + nova);
    }
    if (!Object.keys(patch).length) return fecharModal(W);
    try {
      await api(`usuarios/${u.id}`, 'PATCH', patch);
      Object.assign(S.user, patch);
      lsSet(SESSAO_KEY, { id: u.id, h: S.user.hash });
      fecharModal(W); render(); toast('Conta atualizada');
    } catch (e) { msg.textContent = e.message; }
  };
}

/* =========================================================
   RENDERIZAÇÃO
   ========================================================= */
function render() {

          ${nav('inicio', ICON.home, 'Início')}

          ${nav('todas', ICON.list, 'Todas as tarefas')}
        </nav>
        <div class="side-foot">
          <div class="side-user"><div class="avatar">${esc((u.nome || '?')[0].toUpperCase())}</div>
            <div class="side-user-txt"><b>${esc(u.nome)}</b><small>${esc(u.usuario)}</small></div></div>
