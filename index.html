function filtrosHTML(comOrdem) {
  const op = [['todas', 'Todas'], ['alta', 'Prioridade 70–100'], ['media', 'Prioridade 40–69'], ['baixa', 'Prioridade 0–39'], ['reuniao', 'Reuniões']];
  return `<div class="filters">${op.map(([k, n]) => `<button class="pill ${S.filtro === k ? 'on' : ''}" data-f="${k}">${n}</button>`).join('')}
    ${comOrdem ? `<span class="sep"></span>
      <button class="pill ${S.ordem === 'horario' ? 'on' : ''}" data-o="horario">Ordenar por horário</button>
      <button class="pill ${S.ordem === 'prioridade' ? 'on' : ''}" data-o="prioridade">Ordenar por prioridade</button>` : ''}</div>`;
}
function ligarFiltros() {
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.filtro = b.dataset.f; render(); });
  document.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { S.ordem = b.dataset.o; lsSet('mapaMental.ordem', S.ordem); render(); });
}

// No modo "por horário", separa as tarefas com horário das sem horário
function listaAbertas(abertas) {
  if (S.ordem !== 'horario') return abertas.map(cardHTML).join('');
  const com = abertas.filter(i => i.t.horario), sem = abertas.filter(i => !i.t.horario);
  if (!com.length || !sem.length) return abertas.map(cardHTML).join('');
  return `<div class="sub-title">Com horário · ${com.length}</div>${com.map(cardHTML).join('')}
          <div class="sub-title">Sem horário · ${sem.length}</div>${sem.map(cardHTML).join('')}`;
}

function renderDia() {
  const D = S.dia, H = hoje();
  const dt = parseD(D);
  const nomeDia = dt.toLocaleDateString('pt-BR', { weekday: 'long' });
  const dataLonga = dt.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });
  const rel = D === H ? 'Hoje' : D === addDays(H, -1) ? 'Ontem' : D === addDays(H, 1) ? 'Amanhã' : nomeDia[0].toUpperCase() + nomeDia.slice(1);

  let itens = itensDoDia(D);
  const contaveis = itens.filter(i => i.status !== 'decidir' && i.status !== 'dispensada');
  const feitos = contaveis.filter(i => i.status === 'feito').length;
  const parciais = contaveis.filter(i => i.status === 'parcial').length;
  const decidirN = itens.filter(i => i.status === 'decidir').length;
  const pct = contaveis.length ? Math.round(feitos / contaveis.length * 100) : 0;

  if (S.filtro !== 'todas') itens = itens.filter(i => passaFiltro(i.t));
  const decidir = ordenarDia(itens.filter(i => i.status === 'decidir'));
  const abertas = ordenarDia(itens.filter(i => i.status === 'pendente' || i.status === 'parcial'));
  const feitas = ordenarDia(itens.filter(i => i.status === 'feito'));
  const dispensadas = ordenarDia(itens.filter(i => i.status === 'dispensada'));
  const carregando = !S.registros[D];

  $('#main').innerHTML = `
    <div class="daybar">
      <div class="daynav">
        <button class="icon-btn" id="dPrev" title="Dia anterior">${ICON.prev}</button>
        <button class="icon-btn" id="dNext" title="Próximo dia">${ICON.next}</button>
      </div>
      <h2 class="day-title">${rel}<small>${D === H ? nomeDia + ', ' : ''}${dataLonga}</small></h2>
      <div style="margin-left:auto;display:flex;gap:8px">
        ${D !== H ? `<button class="pill" id="dHoje">Voltar para hoje</button>` : ''}
        <label class="pill date-input" style="display:flex;align-items:center;gap:6px">${ICON.cal.replace('<svg', '<svg width="15" height="15"')}Escolher data<input type="date" id="dPick" value="${D}"></label>
      </div>
    </div>

    <div class="progress-card">
      <div class="progress-num">${feitos}<span>/${contaveis.length}</span></div>
      <div style="flex:1">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-meta">
          <span>${pct}% concluído</span>
          ${parciais ? `<span>${parciais} parcial${parciais > 1 ? 'is' : ''}</span>` : ''}
          ${decidirN ? `<span>${decidirN} sugest${decidirN > 1 ? 'ões' : 'ão'} para decidir</span>` : ''}
        </div>
      </div>
    </div>

    ${filtrosHTML(true)}

    ${carregando ? `<div class="empty"><div class="spin"></div>Carregando o dia…</div>` :
      !itens.length ? `<div class="empty"><h3>${Object.keys(S.tarefas).length ? 'Nada para este dia' : 'Nenhuma tarefa ainda'}</h3>
        <p>${Object.keys(S.tarefas).length ? 'Nenhuma tarefa programada aqui' + (S.filtro !== 'todas' ? ' com esse filtro' : '') + '.' : 'Clique em <b>Nova tarefa</b> para começar.'}</p></div>` : `
      ${decidir.length ? `<div class="section-title">Sugestões · vai precisar hoje? <span class="count">${decidir.length}</span></div>${decidir.map(cardHTML).join('')}` : ''}
      ${abertas.length ? `<div class="section-title">A fazer <span class="count">${abertas.length}</span></div>${listaAbertas(abertas)}` : ''}
      ${feitas.length ? `<div class="section-title">Concluídas <span class="count">${feitas.length}</span></div>${feitas.map(cardHTML).join('')}` : ''}
      ${dispensadas.length ? `<div class="section-title">Dispensadas hoje <span class="count">${dispensadas.length}</span></div>${dispensadas.map(cardHTML).join('')}` : ''}
    `}`;

  $('#dPrev').onclick = () => irParaDia(addDays(D, -1));
  $('#dNext').onclick = () => irParaDia(addDays(D, 1));
  if ($('#dHoje')) $('#dHoje').onclick = () => irParaDia(H);
  $('#dPick').onchange = e => e.target.value && irParaDia(e.target.value);
  ligarFiltros();
}

/* ---------- TELA INICIAL + CALENDÁRIO (ano / mês / semana) ---------- */
const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const inicioSemana = ref => { const d = parseD(ref); d.setDate(d.getDate() - d.getDay()); return ymd(d); };
function mesesDoPeriodo() {
  const r = S.calRef;
  if (S.calModo === 'ano') return MESES.map((_, i) => `${r.slice(0, 4)}-${pad(i + 1)}`);
  if (S.calModo === 'mes') return [r.slice(0, 7)];
  const a = inicioSemana(r), b = addDays(a, 6);
  return [...new Set([a.slice(0, 7), b.slice(0, 7)])];
}
function resumoDia(k) {
  const itens = itensDoDia(k).filter(i => i.status !== 'dispensada');
  const feitos = itens.filter(i => i.status === 'feito').length;
  return { itens, total: itens.length, feitos, reuniao: itens.some(i => i.t.reuniao) };
}
function moverCal(delta) {
  const d = parseD(S.calRef);
  if (S.calModo === 'ano') d.setFullYear(d.getFullYear() + delta, 0, 1);
  else if (S.calModo === 'mes') d.setMonth(d.getMonth() + delta, 1);
  else d.setDate(d.getDate() + 7 * delta);
  S.calRef = ymd(d); render();
}

function renderInicio() {
  const H = hoje(), hr = new Date().getHours();
  const saud = hr < 12 ? 'Bom dia' : hr < 18 ? 'Boa tarde' : 'Boa noite';
  const faltam = mesesDoPeriodo().filter(m => !S.mesesCarregados[m]);
  if (faltam.length && !S.carregandoCal) {
    S.carregandoCal = true;
    Promise.all(faltam.map(m => carregarMes(m).catch(() => { S.mesesCarregados[m] = true; })))
      .finally(() => { S.carregandoCal = false; if (S.view === 'inicio') render(); });
  }
  const ref = parseD(S.calRef);
  let titulo;
  if (S.calModo === 'ano') titulo = String(ref.getFullYear());
  else if (S.calModo === 'mes') titulo = `${MESES[ref.getMonth()]} de ${ref.getFullYear()}`;
  else {
    const a = parseD(inicioSemana(S.calRef)), b = parseD(addDays(inicioSemana(S.calRef), 6));
    titulo = a.getMonth() === b.getMonth() ? `${a.getDate()} a ${b.getDate()} de ${MESES[b.getMonth()].toLowerCase()} de ${b.getFullYear()}`
      : `${a.getDate()}/${pad(a.getMonth() + 1)} a ${b.getDate()}/${pad(b.getMonth() + 1)} de ${b.getFullYear()}`;
  }
  const hj = resumoDia(H);
  const corpo = S.calModo === 'ano' ? calAno() : S.calModo === 'mes' ? calMes() : calSemana();

  $('#main').innerHTML = `
    <div class="daybar">
      <h2 class="day-title">${saud}, ${esc((S.user.nome || '').split(' ')[0])}
        <small>${parseD(H).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} · ${hj.total ? `${hj.feitos} de ${hj.total} tarefa(s) de hoje concluída(s)` : 'nenhuma tarefa hoje'}</small></h2>
    </div>
    <section class="calbox ${S.calMin ? 'is-min' : ''}">
      <div class="calbox-head">
        <div class="daynav">
          <button class="icon-btn" id="cPrev" title="Anterior">${ICON.prev}</button>
          <button class="icon-btn" id="cNext" title="Próximo">${ICON.next}</button>
        </div>
        <h3 class="calbox-title">${titulo}</h3>
        <button class="pill" id="cHoje">Hoje</button>
        <div class="seg-inline">
          ${[['ano', 'Ano'], ['mes', 'Mês'], ['semana', 'Semana']].map(([k, n]) => `<button data-m="${k}" class="${S.calModo === k ? 'on' : ''}">${n}</button>`).join('')}
        </div>
        <button class="icon-btn" id="cMin" title="${S.calMin ? 'Expandir calendário' : 'Minimizar calendário'}">${S.calMin ? ICON.chevDown : ICON.chevUp}</button>
      </div>
      ${S.calMin ? '' : `<div class="calbox-body">${corpo}</div>
        <div class="cal-legend"><span>concluídas/total</span><span><i></i>tem reunião</span><span><i class="lt"></i>pendências em dia passado</span></div>`}
    </section>`;

  $('#cPrev').onclick = () => moverCal(-1);
  $('#cNext').onclick = () => moverCal(1);
  $('#cHoje').onclick = () => { S.calRef = H; render(); };
  $('#cMin').onclick = () => { S.calMin = !S.calMin; lsSet('mapaMental.calMin', S.calMin); render(); };
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { S.calModo = b.dataset.m; lsSet('mapaMental.calModo', S.calModo); render(); });
  document.querySelectorAll('#main [data-d]').forEach(b => b.onclick = e => { e.stopPropagation(); abrirPopupDia(b.dataset.d); });
  document.querySelectorAll('[data-ym]').forEach(b => b.onclick = () => { S.calModo = 'mes'; S.calRef = b.dataset.ym + '-01'; lsSet('mapaMental.calModo', 'mes'); render(); });
}

function clsDia(k, r) {
  const H = hoje(), c = [];
  if (k === H) c.push('today');
  if (r.total) c.push('has');
  if (r.total && r.feitos === r.total) c.push('full');
  if (r.total && k < H && r.feitos < r.total) c.push('late');
  return c.join(' ');
}

function calMes() {
  const [y, m] = S.calRef.slice(0, 7).split('-').map(Number);
  const prim = new Date(y, m - 1, 1), n = new Date(y, m, 0).getDate();
  let html = DIAS_NOME.map(d => `<div class="cal-dow">${d}</div>`).join('') + '<div class="mcell blank"></div>'.repeat(prim.getDay());
  for (let d = 1; d <= n; d++) {
    const k = `${y}-${pad(m)}-${pad(d)}`, r = resumoDia(k);
    const its = r.itens.sort(cmpHora);
    html += `<button class="mcell ${clsDia(k, r)}" data-d="${k}">
      <div class="mcell-top"><span class="n">${d}</span>${r.reuniao ? '<span class="mt"></span>' : ''}${r.total ? `<span class="cnt">${r.feitos}/${r.total}</span>` : ''}</div>
      <div class="mchips">${its.slice(0, 3).map(i => `<div class="mchip ${i.status}">${i.t.horario ? `<b>${esc(i.t.horario)}</b> ` : ''}${esc(i.t.titulo)}</div>`).join('')}
      ${its.length > 3 ? `<div class="more">+${its.length - 3} mais</div>` : ''}</div>
    </button>`;
  }
  return `<div class="mgrid">${html}</div>`;
}

function calAno() {
  const y = +S.calRef.slice(0, 4);
  return `<div class="ygrid">${MESES.map((nome, mi) => {
    const prim = new Date(y, mi, 1), n = new Date(y, mi + 1, 0).getDate();
    let cells = DIAS_CURTO.map(d => `<span class="ydow">${d}</span>`).join('') + '<span></span>'.repeat(prim.getDay());
    for (let d = 1; d <= n; d++) {
      const k = `${y}-${pad(mi + 1)}-${pad(d)}`, r = resumoDia(k);
      cells += `<button class="ycell ${clsDia(k, r)}" data-d="${k}" title="${parseD(k).toLocaleDateString('pt-BR')} · ${r.total ? `${r.feitos}/${r.total} concluída(s)` : 'sem tarefas'}">${d}</button>`;
    }
    return `<div class="ymonth"><button class="ymonth-name" data-ym="${y}-${pad(mi + 1)}">${nome}</button><div class="ydays">${cells}</div></div>`;
  }).join('')}</div>`;
}

function calSemana() {
  const a = inicioSemana(S.calRef);
  return `<div class="wgrid">${[0, 1, 2, 3, 4, 5, 6].map(i => {
    const k = addDays(a, i), dt = parseD(k), r = resumoDia(k);
    const its = r.itens.sort(cmpHora);
    return `<div class="wcol ${k === hoje() ? 'today' : ''}">
      <button class="whead" data-d="${k}"><span>${DIAS_NOME[i]}</span><b>${dt.getDate()}/${pad(dt.getMonth() + 1)}</b>${r.total ? `<small>${r.feitos}/${r.total}</small>` : ''}</button>
      <div class="witems">${its.length ? its.map(it => `<button class="witem ${it.status} p-${faixa(prioNum(it.t))}" data-d="${k}">
          ${it.t.horario ? `<span class="wh">${esc(it.t.horario)}</span>` : ''}<span class="wt">${esc(it.t.titulo)}</span>
          ${it.t.reuniao ? '<span class="wtag">Reunião</span>' : ''}</button>`).join('') : '<div class="wempty">—</div>'}</div>
    </div>`;
  }).join('')}</div>`;
}

async function abrirPopupDia(D) {
  let W; const q = sel => W.querySelector(sel);
  if (!S.registros[D]) { try { await carregarRegistros(D); } catch {} }
  const H = hoje(), dt = parseD(D);
  const tituloData = dt.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const itens = itensDoDia(D);
  const ordem = { decidir: 0, pendente: 1, parcial: 1, feito: 2, dispensada: 3 };
  itens.sort((a, b) => ordem[a.status] - ordem[b.status] || cmpHora(a, b));
  const rotulo = { pendente: 'Pendente', parcial: 'Parcial', feito: 'Concluída', decidir: 'Decidir', dispensada: 'Dispensada' };
  const sim = { pendente: '', parcial: '', feito: ICON.check, decidir: '?', dispensada: '–' };
  const feitos = itens.filter(i => i.status === 'feito').length;
  const total = itens.filter(i => i.status !== 'dispensada').length;

  const linhas = itens.map(it => {
    const { id, t, status } = it;
    const pauta = t.reuniao && S.pautas[id] && S.pautas[id][D];
    let extra = TIPOS[t.tipo];
    if (t.tipo === 'complexa') extra += ` · dia ${it.diaN}`;
    if (it.atrasada) extra += ` · atrasada desde ${fmtCurta(t.data)}`;
    return `<div class="pop-row ${status === 'dispensada' ? 'off' : ''}">
      <span class="pop-st ${status}">${sim[status]}</span>
      <div class="t-body">
        <div class="t-title" style="font-size:14.5px">${horaHTML(t)}${esc(t.titulo)}</div>
        <div class="t-meta">${prioHTML(t)}<span class="badge">${extra}</span>${t.reuniao ? '<span class="badge meet">Reunião</span>' : ''}<span class="badge outline">${rotulo[status]}</span></div>
        ${pauta ? `<div class="note pauta"><b>Pauta:</b> ${esc(pauta.texto)}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  W = abrirModal(`
    <h2 style="margin-bottom:4px;text-transform:capitalize">${D === H ? 'Hoje · ' : ''}${tituloData}</h2>
    <p class="help" style="margin:0 0 14px">${total ? `${feitos} de ${total} concluída(s)` : 'Nenhuma tarefa neste dia'}</p>
    ${linhas || `<div class="empty" style="padding:30px 16px">Nada programado.</div>`}
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="fecharModal(this)">Fechar</button>
      <button class="btn btn-ghost" id="popPip" style="margin-right:auto" title="Abre uma janela pequena que fica por cima de tudo">${ICON.pip.replace('<svg', '<svg width="16" height="16"')} Janela flutuante</button>
      <button class="btn btn-ghost" id="popNova">Nova tarefa neste dia</button>
      <button class="btn btn-primary" id="popAbrir">Abrir este dia</button>
    </div>`);
  q('#popAbrir').onclick = () => { fecharModal(W); S.view = 'dia'; irParaDia(D); };
  q('#popPip').onclick = () => abrirFlutuante();
  q('#popNova').onclick = async () => { fecharModal(W); S.dia = D; formTarefa(); };
}

/* ---------- JANELA FLUTUANTE (fica por cima de tudo) ---------- */
const minutos = hm => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
function proximos() {
  const agora = new Date(), H = hoje(), nowMin = agora.getHours() * 60 + agora.getMinutes();
  let evento = null;
  for (let k = 0; k <= 30 && !evento; k++) {
    const D = addDays(H, k);
    const c = itensDoDia(D).filter(i => i.t.horario && ['pendente', 'parcial', 'decidir'].includes(i.status) && (k > 0 || minutos(i.t.horario) >= nowMin - 30));
    c.sort(cmpHora);
    if (c.length) evento = { ...c[0], D };
  }
  const tarefas = itensDoDia(H).filter(i => !i.t.reuniao && (i.status === 'pendente' || i.status === 'parcial')).sort(cmpPrio);
  return { evento, tarefas };
}
function quandoTxt(D, hm) {
  const H = hoje(), agora = new Date(), nowMin = agora.getHours() * 60 + agora.getMinutes();
  if (D === H) {
    const diff = minutos(hm) - nowMin;
    if (diff <= 0) return `começou há ${-diff} min`;
    if (diff < 60) return `em ${diff} min`;
    return `em ${Math.floor(diff / 60)}h${diff % 60 ? ' ' + pad(diff % 60) + 'min' : ''}`;
  }
  if (D === addDays(H, 1)) return `amanhã às ${hm}`;
  return `${parseD(D).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' })} às ${hm}`;
}
const PIP_CSS = `
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#11121B;color:#E9EBF3;font-family:'DM Sans',system-ui,sans-serif;font-size:14px;padding:14px;min-height:100vh}
  .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .hd b{font-family:'Space Grotesk',sans-serif;font-size:22px;color:#fff}
  .hd small{color:#9496B0;font-size:12px;text-align:right}
  .bar{height:5px;background:#2D2E47;border-radius:9px;overflow:hidden;margin-bottom:14px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#3E7996,#B9D6E4)}
  .lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9496B0;margin:0 0 6px}
  .card{background:#1A1B29;border:1px solid #383A58;border-left:4px solid #6FA3BE;border-radius:10px;padding:10px 12px;margin-bottom:12px}
  .card.ev{border-left-color:#B9D6E4}
  .card.p-alta{border-left-color:#fff}.card.p-baixa{border-left-color:#4b4e72}
  .t{font-weight:600;color:#fff;font-size:15px;line-height:1.3}
  .m{color:#B9D6E4;font-size:12.5px;margin-top:4px}
  .m.muted{color:#9496B0}
  .h{font-family:'Space Grotesk',sans-serif;font-weight:700;color:#B9D6E4;margin-right:6px}
  .nx{font-size:12.5px;color:#9496B0;padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nx b{color:#E9EBF3;font-weight:600}
  .vazio{color:#9496B0;font-size:13px;padding:6px 0 12px}
  button{font-family:inherit;background:none;border:1px solid #383A58;color:#B9D6E4;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;margin-top:4px}
  button:hover{background:#2D2E47}`;
async function abrirFlutuante() {
  if (S.pip && !S.pip.closed) { try { S.pip.focus(); } catch {} return; }
  let pw = null, sempreNoTopo = false;
  if ('documentPictureInPicture' in window) {
    try { pw = await documentPictureInPicture.requestWindow({ width: 340, height: 360 }); sempreNoTopo = true; } catch {}
  }
  if (!pw) {
    pw = window.open('', 'mapaMentalFlutuante', 'width=360,height=400');
    if (!pw) return toast('O navegador bloqueou a janela. Libere pop-ups para este site.');
    toast('Este navegador não deixa a janela fixa por cima — use Chrome ou Edge no computador');
  }
  S.pip = pw;
  pw.document.head.innerHTML = `<meta charset="UTF-8"><title>Mapa Mental · Próximos</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>${PIP_CSS}</style>`;
  pw.document.body.innerHTML = '<div id="pip"></div>';
  if (!S.registros[hoje()]) { try { await carregarRegistros(hoje()); } catch {} }
  atualizarFlutuante();
  clearInterval(S.pipTimer); clearInterval(S.pipSync);
  S.pipTimer = setInterval(atualizarFlutuante, 30000);
  S.pipSync = setInterval(async () => { try { await Promise.all([carregarTarefas(), carregarRegistros(hoje())]); render(); } catch {} }, 120000);
  pw.addEventListener('pagehide', () => { clearInterval(S.pipTimer); clearInterval(S.pipSync); S.pip = null; });
}
function atualizarFlutuante() {
  const pw = S.pip;
  if (!pw || pw.closed) return;
  const el = pw.document.getElementById('pip'); if (!el) return;
  const { evento, tarefas } = proximos();
  const r = resumoDia(hoje()), pct = r.total ? Math.round(r.feitos / r.total * 100) : 0;
  const agora = new Date();
  const t1 = tarefas[0], resto = tarefas.slice(1, 4);
  el.innerHTML = `
    <div class="hd"><b>${pad(agora.getHours())}:${pad(agora.getMinutes())}</b><small>Hoje: ${r.feitos}/${r.total} concluída(s)</small></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="lbl">Próximo evento</div>
    ${evento ? `<div class="card ev"><div class="t"><span class="h">${esc(evento.t.horario)}</span>${esc(evento.t.titulo)}</div>
        <div class="m">${quandoTxt(evento.D, evento.t.horario)}${evento.t.reuniao ? ' · reunião' : ''}</div></div>`
      : `<div class="vazio">Nenhum evento com horário nos próximos dias.</div>`}
    <div class="lbl">Próxima tarefa · por prioridade</div>
    ${t1 ? `<div class="card p-${faixa(prioNum(t1.t))}"><div class="t">${t1.t.horario ? `<span class="h">${esc(t1.t.horario)}</span>` : ''}${esc(t1.t.titulo)}</div>
        <div class="m muted">Prioridade ${prioNum(t1.t)}${t1.atrasada ? ' · atrasada' : ''}${t1.status === 'parcial' ? ' · parcial' : ''}</div></div>
        ${resto.length ? `<div class="lbl" style="margin-top:4px">Depois</div>${resto.map(i => `<div class="nx"><b>${prioNum(i.t)}</b> · ${esc(i.t.titulo)}</div>`).join('')}` : ''}`
      : `<div class="vazio">Nenhuma tarefa pendente hoje. 🎉</div>`}
    <button id="pipAbrir">Abrir o app</button>`;
  pw.document.getElementById('pipAbrir').onclick = () => { try { window.focus(); } catch {} S.view = 'dia'; irParaDia(hoje()); };
}

function cardHTML(it) {
  const { id, t, status } = it, D = S.dia;
  const cls = ['task', 'p-' + faixa(prioNum(t))];
  if (status === 'feito' || status === 'dispensada') cls.push('done');
  if (status === 'decidir') cls.push('suggest');
  if (it.atrasada) cls.push('late');

  const badges = [prioHTML(t)].filter(Boolean);
  let tipoTxt = TIPOS[t.tipo];
  if (t.tipo === 'diaria') tipoTxt += ' · ' + (t.dias.length === 7 ? 'todos os dias' : t.dias.join() === '1,2,3,4,5' ? 'seg a sex' : t.dias.map(d => DIAS_NOME[d]).join(', '));
  if (t.tipo === 'complexa') tipoTxt += ` · dia ${it.diaN}`;
  badges.push(`<span class="badge">${tipoTxt}</span>`);
  if (t.reuniao) badges.push(`<span class="badge meet">Reunião</span>`);
  if (it.atrasada) badges.push(`<span class="badge strong">Atrasada · ${fmtCurta(t.data)}</span>`);
  if (it.rolou && status !== 'feito') badges.push(`<span class="badge blue">Desde ${fmtCurta(t.data)}</span>`);
  if (status === 'parcial') badges.push(`<span class="badge blue">Parcial hoje</span>`);

  // Última anotação de progresso (complexa)
  let nota = '';
  if (t.tipo === 'complexa' && t.historico) {
    const datas = Object.keys(t.historico).filter(d => d <= D).sort();
    const ult = datas[datas.length - 1];
    if (ult && t.historico[ult].nota) nota = `<div class="note"><b>${ult === D ? 'Hoje' : fmtCurta(ult)}:</b> ${esc(t.historico[ult].nota)}</div>`;
  }

  let check = '', acoes = '';
  if (status === 'decidir') {
    acoes = `<div class="t-actions"><button class="mini primary" onclick="decidir('${id}','sim')">Sim, fazer hoje</button>
             <button class="mini" onclick="decidir('${id}','nao')">Não precisa</button></div>`;
  } else if (status === 'dispensada') {
    acoes = `<div class="t-actions"><button class="mini" onclick="decidir('${id}',null)">${ICON.undo.replace('<svg', '<svg width="12" height="12" style="vertical-align:-1px"')} Rever decisão</button></div>`;
  } else {
    check = `<button class="check ${status === 'feito' ? 'on' : status === 'parcial' ? 'half' : ''}" title="${status === 'feito' ? 'Desmarcar' : 'Concluir'}" onclick="alternarFeito('${id}')">${ICON.check}</button>`;
    if (t.tipo === 'complexa') {
      acoes = status === 'feito'
        ? `<div class="t-actions"><button class="mini" onclick="alternarFeito('${id}')">Reabrir</button></div>`
        : `<div class="t-actions">
             <button class="mini" onclick="marcarParcial('${id}')">${status === 'parcial' ? 'Editar progresso' : 'Parcialmente concluída'}</button>
             ${status === 'parcial' ? `<button class="mini" onclick="desfazerParcial('${id}')">Desfazer parcial</button>` : ''}
             <button class="mini primary" onclick="alternarFeito('${id}')">Concluir</button>
           </div>`;
    } else if (t.tipo === 'sugestiva' && status !== 'feito') {
      acoes = `<div class="t-actions"><button class="mini" onclick="decidir('${id}',null)">Rever decisão</button></div>`;
    }
  }

  // Pauta da reunião (registrada ao concluir)
  const pauta = t.reuniao && S.pautas[id] && S.pautas[id][D];
  if (pauta) nota += `<div class="note pauta"><b>Pauta:</b> ${esc(pauta.texto)}</div>`;
  if (t.reuniao && status === 'feito') {
    const btn = `<button class="mini" onclick="abrirPauta('${id}','${D}',false)">${pauta ? 'Editar pauta' : 'Registrar pauta'}</button>`;
    acoes = acoes ? acoes.replace('<div class="t-actions">', '<div class="t-actions">' + btn) : `<div class="t-actions">${btn}</div>`;
  }

  return `<div class="${cls.join(' ')}">
    ${check}
    <div class="t-body">
      <div class="t-title">${horaHTML(t)}${esc(t.titulo)}</div>
      ${t.descricao ? `<div class="t-desc">${esc(t.descricao)}</div>` : ''}
      <div class="t-meta">${badges.join('')}</div>
      ${nota}${acoes}
    </div>
    <div class="t-side"><button class="icon-btn" title="Editar" onclick="formTarefa('${id}')">${ICON.edit}</button></div>
  </div>`;
}

function renderTodas() {
  let lista = Object.entries(S.tarefas).map(([id, t]) => ({ id, t }));
  if (S.filtro !== 'todas') lista = lista.filter(i => passaFiltro(i.t));
  const grupos = Object.keys(TIPOS).map(tipo => ({ tipo, itens: ordenar(lista.filter(i => i.t.tipo === tipo)) })).filter(g => g.itens.length);

  const det = t => {
    if (t.tipo === 'diaria') return t.dias.map(d => DIAS_NOME[d]).join(', ') + ` · desde ${fmtCurta(t.inicio)}`;
    if (t.tipo === 'unica') return `${fmtCurta(t.data)}${t.concluidaEm ? ' · concluída' : t.data < hoje() ? ' · atrasada' : ''}`;
    if (t.tipo === 'complexa') {
      const n = t.historico ? Object.keys(t.historico).length : 0;
      return `Início ${fmtCurta(t.data)}${t.concluidaEm ? ` · concluída em ${fmtCurta(t.concluidaEm)}` : ` · em andamento há ${Math.max(1, diffDays(t.data, hoje()) + 1)} dia(s)`}${n ? ` · ${n} registro(s) de progresso` : ''}`;
    }
    return `Aparece todo dia · desde ${fmtCurta(t.inicio)}`;
  };

  $('#main').innerHTML = `
    <div class="daybar"><h2 class="day-title">Todas as tarefas<small>${Object.keys(S.tarefas).length} cadastrada(s) · desative para pausar sem excluir</small></h2></div>
    ${filtrosHTML()}
    ${!grupos.length ? `<div class="empty"><h3>Nenhuma tarefa</h3><p>Clique em <b>Nova tarefa</b> para cadastrar.</p></div>` :
      grupos.map(g => `
        <div class="section-title">${TIPOS[g.tipo]} <span class="count">${g.itens.length}</span></div>
        ${g.itens.map(({ id, t }) => `
          <div class="list-row ${t.ativa === false ? 'off' : ''}">
            <button class="switch ${t.ativa === false ? '' : 'on'}" title="${t.ativa === false ? 'Ativar' : 'Pausar'}" onclick="alternarAtiva('${id}')"></button>
            <div class="t-body">
              <div class="t-title">${horaHTML(t)}${esc(t.titulo)}</div>
              <div class="t-meta">${prioHTML(t)}${t.reuniao ? '<span class="badge meet">Reunião</span>' : ''}<span class="badge outline">${det(t)}</span></div>
            </div>
            ${t.reuniao ? `<button class="mini" onclick="verPautas('${id}')">Pautas (${Object.keys(S.pautas[id] || {}).length})</button>` : ''}
            <div class="t-side">
              <button class="icon-btn" title="Editar" onclick="formTarefa('${id}')">${ICON.edit}</button>
              <button class="icon-btn" title="Excluir" onclick="excluirTarefa('${id}')">${ICON.trash}</button>
            </div>
          </div>`).join('')}
      `).join('')}`;
  ligarFiltros();
}

boot();
</script>
